[project]
name = "retouch-automation"
version = "0.1.0"
description = "生花作品RAW写真のAI一括処理・XMP生成システム"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "rawpy>=0.23",
    "Pillow>=10.3",
]

[project.optional-dependencies]
# Phase 3 以降で使う。バージョンは Phase 0 の動作確認後に固定する。
models = [
    "torch",
    "torchvision",
    "transformers",
    "timm",
]

[project.scripts]
retouch-automation = "retouch_automation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retouch_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
